[package]
name = "slotshift"
version = "0.2.2"
edition = "2024"
rust-version = "1.94"
description = "A native, GPU-rendered account launcher for Codex CLI"
license = "MIT"
repository = "https://github.com/joenilan/slotshift"

[features]
default = ["desktop"]
desktop = ["dep:gpui-kit"]

[dependencies]
anyhow = "1"
base64 = "0.22"
directories = "6"
fs2 = "0.4"
gpui-kit = { version = "=0.7.1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
smol = "2"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }

[[bin]]
name = "slotshift"
path = "src/main.rs"
required-features = ["desktop"]

[profile.dev]
debug = 0
incremental = false

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 16
strip = "symbols"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
